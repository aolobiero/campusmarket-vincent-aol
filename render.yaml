services:
  - type: web
    name: campusmarket
    runtime: docker
    plan: free
    healthCheckPath: /index.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        value: mysql-1ffbda72-campusmarket.j.aivencloud.com
      - key: DB_PORT
        value: "10167"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
